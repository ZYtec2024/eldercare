server {
    listen 80;
    server_name localhost;

    # Do not set Permissions-Policy here. Edge has treated a restrictive
    # geolocation=(self) header as "site cannot ask", which surfaces as
    # PERMISSION_DENIED without a prompt. Match the uploaded/master nginx.

    # 前端静态资源
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 代理到后端
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Preserve UTF-8 Chinese in JSON for Windows browsers/clients
        proxy_set_header Accept-Charset utf-8;
        charset utf-8;
        source_charset utf-8;
    }
}
