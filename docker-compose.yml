services:
  # ===== openGauss 数据库 =====
  db:
    image: ${OPENGAUSS_IMAGE:-enmotech/opengauss:latest}
    container_name: eldercare-db
    privileged: true
    environment:
      GS_PASSWORD: Enmo@123
      TZ: Asia/Shanghai
    volumes:
      # 首次启动自动导入演示数据
      - ./eldercare_backend/init_demo_data.sql:/docker-entrypoint-initdb.d/init.sql
      # 持久化数据（容器重启不丢失）
      - ogdata:/var/lib/opengauss
      # 时区
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:5432:5432"

  # ===== Flask 后端 =====
  backend:
    build: ./eldercare_backend
    container_name: eldercare-backend
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: gaussdb
      DB_PASSWORD: Enmo@123
      DB_NAME: omm
      TZ: Asia/Shanghai
      # 公网部署必须在 .env 中设置高强度随机值，并将 SESSION_COOKIE_SECURE 改为 true。
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-before-production}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      ALLOW_DEMO_PASSWORD_RESET: ${ALLOW_DEMO_PASSWORD_RESET:-true}
      FLASK_DEBUG: ${FLASK_DEBUG:-false}
      APP_ENV: ${APP_ENV:-development}
      ENABLE_SIMULATION: ${ENABLE_SIMULATION:-false}
      ARRIVAL_GEOFENCE_METERS: ${ARRIVAL_GEOFENCE_METERS:-100}
      ARRIVAL_MAX_ACCURACY_METERS: ${ARRIVAL_MAX_ACCURACY_METERS:-150}
      # 行政区官方边界（高德 Web 服务 Key；需开通「行政区域查询」）
      AMAP_WEB_KEY: ${AMAP_WEB_KEY:-09b7fc116d61f287bdc729d4818cb583}
    depends_on:
      - db
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ===== 前端（Nginx + React） =====
  frontend:
    build: ./frontend
    container_name: eldercare-frontend
    environment:
      TZ: Asia/Shanghai
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - /etc/localtime:/etc/localtime:ro

volumes:
  ogdata:
