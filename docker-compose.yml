services:
  # ===== PostgreSQL 数据库 =====
  db:
    image: postgres:16
    container_name: eldercare-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: elderly_care_system
    volumes:
      # 首次启动自动导入演示数据
      - ./eldercare_backend/init_demo_data.sql:/docker-entrypoint-initdb.d/init.sql
      # 持久化数据（容器重启不丢失）
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elderly_care_system"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ===== Flask 后端 =====
  backend:
    build: ./eldercare_backend
    container_name: eldercare-backend
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: root
      DB_NAME: elderly_care_system
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ===== 前端（Nginx + React） =====
  frontend:
    build: ./frontend
    container_name: eldercare-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  pgdata:
